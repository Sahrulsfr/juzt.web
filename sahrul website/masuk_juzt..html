<body class="bg-surface-container text-on-surface min-h-screen flex flex-col font-body-md">
<!-- Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative">
<!-- Minimalist Background Accent -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-1/4 -left-24 w-96 h-96 bg-surface-container-highest rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
<div class="absolute bottom-1/4 -right-24 w-[30rem] h-[30rem] bg-surface-container-highest rounded-full mix-blend-multiply filter blur-3xl opacity-30"></div>
</div>
<div class="w-full max-w-[480px] bg-surface-container-lowest p-8 md:p-12 z-10 border border-outline-variant shadow-sm relative">
<!-- Logo / Brand Anchor -->
<div class="text-center mb-12">
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">JUZT.</h1>
<p class="font-body-md text-body-md text-secondary mt-2">Silakan masuk ke akun Anda</p>
</div>
<!-- Login Form -->
<form action="akun.html" class="space-y-8" method="GET">
<div class="space-y-6">
<!-- Email Input -->
<div class="relative group">
<label class="block font-label-caps text-label-caps text-secondary mb-2 uppercase tracking-widest" for="email">Email</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-body-md text-body-md text-primary placeholder:text-secondary transition-colors" id="email" name="email" placeholder="nama@email.com" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="relative group">
<div class="flex justify-between items-baseline mb-2">
<label class="block font-label-caps text-label-caps text-secondary uppercase tracking-widest" for="password">Password</label>
<a class="font-label-caps text-label-caps text-secondary hover:text-primary transition-colors uppercase" href="#">Lupa?</a>
</div>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-2 font-body-md text-body-md text-primary placeholder:text-secondary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="pt-4 space-y-4">
<button class="w-full bg-primary text-on-primary py-4 px-6 font-button-label text-button-label uppercase tracking-[0.15em] hover:bg-tertiary-container transition-colors duration-300" type="submit">
                        MASUK
                    </button>
<div class="text-center">
<span class="font-body-md text-body-md text-secondary">Belum punya akun?</span>
<a class="inline-block ml-2 font-button-label text-button-label text-primary uppercase tracking-[0.15em] border-b border-transparent hover:border-primary transition-colors pb-0.5" href="daftar.html">
                            BUAT AKUN BARU
                        </a>
</div>
</div>
</form>
</div>
</main>
<script>
        // Minimal interaction for form inputs
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.replace('text-secondary', 'text-primary');
            });
            input.addEventListener('blur', () => {
                if(!input.value) {
                    input.parentElement.querySelector('label').classList.replace('text-primary', 'text-secondary');
                }
            });
        });
    </script>
</body></html>
